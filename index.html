<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Ecomove</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app">
        <!-- aside -->
        <aside class="sidebar">
            <div class="profile-card">
                <img id="company-logo" class="avatar" src="#" alt="Logo EcoMove">
                <h1>Ecomove</h1>
            </div>
            <div class="stats">
                <div>
                    <strong id="total-activities">0</strong>
                    <span>Qtd. Atividades</span>
                </div>
                <div>
                    <strong id="total-co2">0</strong>
                    <span>Qtd. co2 (kg)</span>
                </div>
            </div>

            <button id="activity-tab" class="activity-tab" disabled>Atividade</button>

            <footer class="sidebar-footer">
                <h2>Ecomove</h2>
                <div class="sociais">
                    <a href="#" class="social-link">Instagram</a>
                    <a href="#" class="social-link">Twitter</a>
                    <a href="#" class="social-link">TikTok</a>
                </div>
                <span>Copyright-2024</span>
            </footer>
        </aside>
        <main class="content">
            <header class="topbar">
                <button id="auth-btn" class="btn-dark">Login</button>
            </header>
            <nav class="filters" id="filters">
                <button data-type="bicicleta">Bicicleta</button>
                <button data-type="caminhada">Caminhada</button>
                <button data-type="transporte_publico">Transporte público</button>
            </nav>

            <section id="activity-form-section" class="activity-form hidden">
                <h2>Crie sua atividade</h2>

                <div class="form-grid">
                    <div>
                        <label for="activity-type">Tipo da atividade</label>
                        <select id="activity-type">
                            <option value="">Selecione</option>
                            <option value="bicicleta">bicicleta</option>
                            <option value="caminhada">caminhada</option>
                            <option value="transporte_publico">transporte_publico</option>

                        </select>
                        <small class="error" id="error-type"></small>
                    </div>
                    <div>
                        <label>
                            Distância (metros)
                            <input type="number" id="activity-distance" placeholder="Ex: 1000">
                        </label>
                    </div>
                    <div>
                        <label>
                            Duração (minutos)
                            <input type="number" id="activity-duration" placeholder="Ex: 30">
                        </label>
                    </div>
                </div>
                <button id="create-activity" class="btn-dark">Criar atividade</button>
            </section>
            <section id="activities-list" class="activities">
                <!-- lista de atividades publicadas será renderizada aqui via JS -->
            </section>
            <div id="pagination" class="pagination">
                <!-- botões de paginação serão renderizados aqui via JS -->
            </div>
        </main>
    </div>



    <div id="login-modal" class="modal hidden">
        <div class="modal-box">

            <div class="modal-head">
                <h3>Login</h3>
                <button id="close-modal">x</button>
            </div>

            <!-- CAMPO E-MAIL (pronto — use como modelo) -->
            <label for="login-email">Email</label>
            <input id="login-email" type="email" />

            <label for="login-password">Senha</label>
            <input id="login-password" type="password" />

            <small id="login-error" class="error"></small>

            <div class="modal-actions">
                <button id="submit-login" class="btn-dark">Login</button>
                <button id="cancel-login">Cancelar</button>

            </div>

        </div>
    </div>

    <template id="activity-card-template">
            <article class="activity-card">

                <div class="activity-header">
                    <!-- !!! por enquanto é para ficar vazio -->
                    <h3 class="activity-title"></h3>
                    <time datetime="activity-date"></time>
                </div>

                <div class="activity-body">

                    <img class="activity-avatar" alt="Foto do usuário" />

                    <div>
                        <strong class="activity-user"></strong>

                        <div class="metrics">
                            <!-- MÉTRICA 1 (pronta — use como modelo) -->
                            <p><span class="distance"></span><small>Distância</small></p>
                            <p><span class="duration"></span><small>Duração</small></p>
                            <p><span class="co2"></span><small>CO₂ evitado</small></p>

                        </div>
                    </div>

                    <div class="actions">

                        <button class="like-btn">♡</button>
                        <span class="likes-count">0</span>
                        <button class="comment-btn">💬</button>
                        <span class="comments-count">0</span>
                    </div>

                </div>

                <div class="comment-box hidden">

                    <input class="comment-input" placeholder="Escreva um comentario..">
                    <button class="send-comment">Enviar</button>
                    <small class="error">Erro</small>
                </div>

            </article>
        </template>
</body>

</html>
